name: Publish release
on:
  push:
    branches: [main]
    paths: ['parts/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the parts and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat parts/part-* > BlockComet.apk
          ls -l BlockComet.apk
          unzip -tq BlockComet.apk | tail -1
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest BlockComet.apk THIRD_PARTY_NOTICES.txt --title "BlockComet (latest)" --notes "Direct download: BlockComet.apk. Signed with Copper's debug key. Licenses: THIRD_PARTY_NOTICES.txt"
      - name: Remove the parts from the repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm -rq parts
          git commit -qm "Remove upload parts [skip ci]"
          git push
